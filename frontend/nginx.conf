events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    client_max_body_size 2G;
    
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        
        # No cache for index.html to force SPA reload
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            try_files $uri =404;
        }
        
        # API proxy (solo para rutas que no son storage)
        location /api/ {
            proxy_pass http://backend:4001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }
        
        # 🆕 STORAGE DIRECTO: Videos y archivos desde SeaweedFS sin pasar por Express
        # Nginx maneja el buffering y Range requests de forma nativa
        location /storage/ {
            proxy_pass http://seaweedfs-filer:8333/onboarding-hub/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            # Soporte Range Requests nativo de Nginx
            proxy_set_header Range $http_range;
            
            # Desactivar buffering para streaming fluido
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Timeouts largos para videos grandes
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            
            # CORS headers
            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Expose-Headers 'Content-Range, Accept-Ranges, Content-Length';
        }
        
        # SPA fallback
        location / {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }
}
